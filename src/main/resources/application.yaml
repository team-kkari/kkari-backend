spring:
  application:
    name: kkari-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kkari}
    username: ${DB_USERNAME:kkari}
    password: ${DB_PASSWORD:kkari}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: method
  default-produces-media-type: application/json
  override-with-generic-response: false
